name: workbuddy-skin Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: workbuddy-skin-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Verify CLI on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: macOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run CLI checks, tests, and package verification
        run: npm run release:check

  package:
    name: Test and package CLI
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run CLI checks and tests
        run: |
          npm run check
          npm test
          npm run pack:check

      - name: Create npm package
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          shopt -s nullglob
          packages=(./*.tgz)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one npm package, found ${#packages[@]}."
            exit 1
          fi
          mkdir release
          mv "${packages[0]}" release/

      - name: Smoke-test global installation from tarball
        shell: bash
        run: |
          set -euo pipefail
          package_path="$(find "${GITHUB_WORKSPACE}/release" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "${package_path}"
          prefix="${RUNNER_TEMP}/workbuddy-skin-global"
          smoke_root="${RUNNER_TEMP}/workbuddy-skin-smoke"
          npm install --global --prefix "${prefix}" "${package_path}"
          export WORKBUDDY_SKIN_USER_DATA_ROOT="${smoke_root}/user-data"
          export WORKBUDDY_SKIN_DATA_ROOT="${smoke_root}/data"
          export WORKBUDDY_SKIN_RUNTIME_STATE_ROOT="${smoke_root}/runtime-state"
          "${prefix}/bin/workbuddy-skin" --version
          "${prefix}/bin/workbuddy-skin" paths
          "${prefix}/bin/workbuddy-skin" templates
          ! "${prefix}/bin/workbuddy-skin" templates --target workbuddy
          ! "${prefix}/bin/workbuddy-skin" status --edition auto

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            shasum -a 256 -- *.tgz > SHA256SUMS.txt
          )

      - name: Upload CLI package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbuddy-skin-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.tgz
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release/*.tgz release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "workbuddy-skin ${GITHUB_REF_NAME}" \
            --generate-notes

# This workflow intentionally ships only the npm tarball through GitHub Releases.
# It does not run `npm publish`; registry publication remains a separate explicit action.
