name: skin-cli Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: skin-cli-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Test and package CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run CLI checks and tests
        run: |
          npm run check
          npm test
          npm run pack:check

      - name: Create npm package
        shell: bash
        run: |
          set -euo pipefail
          npm pack
          shopt -s nullglob
          packages=(./*.tgz)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one npm package, found ${#packages[@]}."
            exit 1
          fi
          mkdir release
          mv "${packages[0]}" release/

      - name: Smoke-test global installation from tarball
        shell: bash
        run: |
          set -euo pipefail
          package_path="$(find "${GITHUB_WORKSPACE}/release" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "${package_path}"
          prefix="${RUNNER_TEMP}/skin-cli-global"
          smoke_root="${RUNNER_TEMP}/skin-cli-smoke"
          npm install --global --prefix "${prefix}" "${package_path}"
          export DREAMSKIN_USER_DATA_ROOT="${smoke_root}/user-data"
          export DREAMSKIN_DATA_ROOT="${smoke_root}/data"
          export DREAMSKIN_TRAE_RUNTIME_STATE_ROOT="${smoke_root}/trae-runtime"
          export DREAMSKIN_WORKBUDDY_RUNTIME_STATE_ROOT="${smoke_root}/workbuddy-runtime"
          "${prefix}/bin/skin-cli" --version
          "${prefix}/bin/skin-cli" targets
          "${prefix}/bin/skin-cli" templates --target trae

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            shasum -a 256 -- *.tgz > SHA256SUMS.txt
          )

      - name: Upload CLI package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skin-cli-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.tgz
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release/*.tgz release/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "skin-cli ${GITHUB_REF_NAME}" \
            --generate-notes

# This workflow intentionally ships only the npm tarball through GitHub Releases.
# It does not run `npm publish`; registry publication remains a separate explicit action.
